<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greeter</title>
    <style>
      /* font import link */
      @import url('https://fonts.googleapis.com/css2?family=Barriecito&display=swap');


      @media only screen and (min-width: 1024px){
        body{
          background-color: red;
          padding: 100px;
        }
      }

      *{
        font-size:1.25em;
        font-family: "Barriecito", system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }

      .inline{
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      button{
        width: 150px;
        height: 50px;
        font-size: 14pt;
      }

      hr{
        border-color:white;
        border-width: 2px;
      }

    </style>
    <script>
    
    /**
     * Takes text inputs, if any, from the first and last name input boxes and prints it to 
     * the output box. 
     * Also checks if the shoutify checkbox is checked and sends the output 
     * text to uppercase if true.
     * @param {boolean} bool - true if saying hello, false if saying goodbye
     */
    const greet = bool => {
      // creates
        let firstName = "";
        let lastName = "";

        let firstInput = document.querySelector("#input-firstname").value.trim();
        let lastInput = document.querySelector("#input-lastname").value.trim();

        let output = document.querySelector("#output");
        let isShouted = document.querySelector("#shoutify").checked

        // checks if the first name input is empty
        // first name is assigned to "Peter" if the input is empty, else takes the input.
        if(firstInput == firstName){
          firstName = "Peter";
        }
        else{
          firstName = firstInput;
        }

        // checks if the last name input is empty
        // last name is assigned to "Parker" if the input is empty, else takes the input
        if(lastInput == lastName){
          lastName = "Parker";
        }
        else{
          lastName = lastInput;
        }

        // checks if the output will be saying hello or goodbye
        // if true, will say hello; if false, will say goodbye
        if(bool){
          output.innerHTML = `Hello ${firstName} ${lastName}!`
        }
        else{
          output.innerHTML = `Goodbye ${firstName} ${lastName}!`
        }

        // checks if the shoutify box is checked and makes the output text uppercase
        if(isShouted){
          output.innerHTML = output.innerHTML.toUpperCase();
        }
      }


      /**
       * Runs upon page load;
       * creates references to hello and bye buttons and assigns them their respective 
       * onclick events.
       * Also imperatively styles the output box
      */
    const init = () =>{
    // get references to the hello and bye buttons
      const helloBtn = document.querySelector("#btn-hello")
      const byeBtn = document.querySelector("#btn-bye")

      // onclick events for the two buttons
      helloBtn.onclick = (e) => greet(true);
      byeBtn.onclick = (e) => greet(false);

      // imperatively changing the output styling
      document.querySelector("#output").style.color = "red";
      document.querySelector("#output").style.backgroundColor = "yellow";
    }

    window.onload = init;
    </script>
  </head>
<body>
  <div class="container">
    <button id="btn-hello">Say Hi!</button>
    <button id="btn-bye">Say Bye!</button>
    <p class="inline"><input type="checkbox" id="shoutify"> Shoutify!</p>
  </div>
  <hr>
  <div class="container">
    <input id="input-firstname" placeholder="First name">
    <input id="input-lastname" placeholder="Last name">
  </div>
  <p id="output">???</p>
</body>
</html>
