<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Screensaver</title>
	<style>
	canvas{
		border:1px solid gray;
	}

    body{font-family: sans-serif;}
        
    button{
        font-size:1.2em;
    }
        
    section{
        margin:.5em 0 .5em 0;
    }
	</style>
	<script>
		// #0 - in this class we will always use ECMAScript 5's "strict" mode
		// See what 'use strict' does here:
		// https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions_and_function_scope/Strict_mode
		"use strict";

        let canvas, ctx, width, height;
        let paused = false;
        let createRect;
        let createArcs;
        let createLines;
		
		// #1 call the `init` function after the pages loads
		window.onload = init;
	
		function init(){
			console.log("page loaded!");
			// #2 Now that the page has loaded, start drawing!
			
			// A - `canvas` variable points at <canvas> tag
			canvas = document.querySelector("canvas");
            width = canvas.width.valueOf();
            height = canvas.height.valueOf();

            createRect = document.querySelector("#cbRectangles").checked;
            createArcs = document.querySelector("#cbArcs").checked;
            createLines = document.querySelector("#cbLines").checked;
			
			// B - the `ctx` variable points at a "2D drawing context"
			ctx = canvas.getContext("2d");

            drawRectangle(20,20,600,440,"red");

            // creating the second rectangle
            drawRectangle(120,120,400,300,"green");
            
            // creating a third rectangle
            drawRectangle(50,50,200,200,"none",10, "purple");

            // creating a rectangle the "hard way"
            drawRectangle(100,100,50,50,"white",2,"black")

			// creating two line paths
            drawLine(34,45,120,35,5,"white");
            drawLine(100,195,85,10,5,"white");

			// creating a circle
            drawArc(500,300,80,"cyan",5,"black");

			// creating the semi circle
            drawArc(400,300,80,"cyan",5,"black",0,Math.PI);

			// creating the two "eyes"
            // whites of eyes
            drawArc(300,240,10,"white",2,"black");
            drawArc(340,240,10,"white",2,"black");
            
            // pupils
            drawArc(300,240,3,"black");
            drawArc(340,240,3,"black");

			// creating the last line
            drawLine(10,20,610,20,20)

            // setting up canvas animations & interactions
            setupUI();
            update();
		}

        // ===== canvas interaction functions
        // updates
        function update(){
            if (paused){
                return;
            }
            else{
                if(createRect){
                    drawRandomRect();
                }
                if(createArcs){
                    drawRandomArc();
                }
                if(createLines){
                    drawRandomLine();
                }
                requestAnimationFrame(update);
            }
        }

        // draws 10 circles of variable color and size around the user's mouse when clicking on canvas
        function canvasClicked(e){
            let rect = e.target.getBoundingClientRect();
            let mouseX = e.clientX - rect.x;
            let mouseY = e.clientY - rect.y;
            console.log(mouseX,mouseY);

            for(let i = 0; i < 10; i++){
                let x = getRandomInt(-100, 100) + mouseX;
                let y = getRandomInt(-100, 100) + mouseY;
                let r = getRandomInt(10,30);
                let color = getRandomColor();
                drawArc(x, y, r, color);
            }
        }

        // declares and sets up button and 
        function setupUI(){
            document.querySelector("#btnPause").onclick = (e) => {
                paused = true;
            }

            document.querySelector("#btnPlay").onclick = (e) =>{
                paused = false;
                update();
            }

            document.querySelector("#btnClear").onclick = (e) =>{
                ctx.clearRect(0,0,width,height);
            }

            document.querySelector("#cbRectangles").onclick = (e) => {
                createRect = !createRect;
                console.log(createRect);
            }

            document.querySelector("#cbArcs").onclick = (e) => {
                createArcs = !createArcs;
                console.log(createArcs);
            }

            document.querySelector("#cbLines").onclick = (e) => {
                createLines = !createLines;
                console.log(createLines);
            }

            canvas.onclick = (e) => {
                if(createArcs){
                    canvasClicked(e);
                }
            }
        }

        // ====== random drawing functions =====
        // uses draw rectangle to draw a rectangle of random size and color in a random posiiton
        function drawRandomRect(){
            drawRectangle(
                getRandomInt(0,width),
                getRandomInt(0,height),
                getRandomInt(10,90),
                getRandomInt(10,90),
                getRandomColor()
            )
        }        
        
        // uses draw arc to draw a circle of random size, color, and stroke in a random position
        function drawRandomArc(){
            drawArc(
                getRandomInt(0,width),
                getRandomInt(0,height),
                getRandomInt(10,90),
                getRandomColor(),
                getRandomInt(1,20),
                getRandomColor()
            )
        }

        // uses draw line to draw a line of random thickness, length, and color in a random position
        function drawRandomLine(){
            drawLine(
                getRandomInt(0,width),
                getRandomInt(0,height),
                getRandomInt(0,width),
                getRandomInt(0,height),
                getRandomInt(1,20),
                getRandomColor()
            )
        }
        
        // utility functions
        // gets a random color as rgba value
        function getRandomColor(){
            function getByte(){
                return 55 + Math.round(Math.random() * 200);
            }
            return "rgba(" + getByte() + "," + getByte() + "," + getByte() + ",.8)";
        }

        // gets a random int between a min and max
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // draws rectangle
        function drawRectangle(x, y, width, height, fillStyle="black", lineWidth=0, strokeStyle="black"){
            ctx.save();
            ctx.fillStyle = fillStyle;
            ctx.beginPath();
            ctx.rect(x, y, width, height);
            ctx.fill();
            if(lineWidth > 0){
                ctx.strokeStyle = strokeStyle;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }
            ctx.closePath();
            ctx.restore();
        }

        // draws arc
        function drawArc(x, y, radius, fillStyle="black", lineWidth=0, strokeStyle="black", startAngle=0, endAngle=(Math.PI*2)){
            ctx.save();
            ctx.fillStyle = fillStyle;
            ctx.beginPath();
            ctx.arc(x, y, radius, startAngle, endAngle);
            ctx.fill();
            if(lineWidth > 0){
                ctx.strokeStyle = strokeStyle;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }
            ctx.closePath();
            ctx.restore();
        }

        // draws line
        function drawLine(startX, startY, endX, endY, lineWidth=1, strokeStyle="black"){
            ctx.save();
            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            ctx.closePath();
            ctx.restore();
        }
    </script>
</head>
<body>
	<canvas width="640" height="480">
		Get a real browser!
	</canvas>
    <section>
    <button id="btnPlay">Play</button>
    <button id="btnPause">Pause</button>
    <button id="btnClear">Clear Screen</button>
    </section>
    <section>
        <span>
            <input type="checkbox" id="cbRectangles" checked>
            <label for="cbRectangles">Rectangles</label>
        </span>

        <span>
            <input type="checkbox" id="cbArcs" checked>
            <label for="cbArcs">Arcs</label>
        </span>

        <span>
            <input type="checkbox" id="cbLines" checked>
            <label for="cbLines">Lines</label>
        </span>
    </section>
    <section>
    <p>Click on the screen to "spraypaint" arcs (you probably want the screensaver to be paused)</p>
    </section>
</body>
</html>
